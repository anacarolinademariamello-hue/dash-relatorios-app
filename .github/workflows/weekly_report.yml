name: Relatório Semanal (toda segunda-feira)

on:
  schedule:
    # Toda segunda-feira às 08:00 BRT (11:00 UTC)
    - cron: '0 11 * * 1'
  workflow_dispatch:   # permite rodar manualmente pelo GitHub

jobs:
  generate-weekly-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install requests anthropic

      - name: Gerar relatórios semanais (últimos 7 dias)
        env:
          META_ACCESS_TOKEN:    ${{ secrets.META_ACCESS_TOKEN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO:             ${{ secrets.EMAIL_TO }}
        run: python scripts/auto_report.py --mode weekly
